version: "3.2"
services:
  opcserver:
    container_name: opcserver
    hostname: opcserver # the certificate is issued for this name
    image: opcserver
    restart: always
    ports:
      - "4840:4840"
    volumes:
      - opcua-certs:/certs # keeps the server certificate across restarts
    networks:
      backend:
    environment:
      - PUMP_FILTER_DEGRADATION_RATE=3
      - PUMP_AUTO_RESET_MINUTES=1
      - PUMP_DEFAULT_OPERATING_LEVEL=80
      - PUMP_UPDATE_INTERVAL=3.0

networks:
  backend:
    external: true
    name: opc-ua-gateway_backend

volumes:
  opcua-certs:
